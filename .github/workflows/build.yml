name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - run: nix build --no-write-lock-file
      # tests, palette-is-current, module-wiring, lua-is-clean, shell-is-clean
      - run: nix flake check --no-write-lock-file
      - run: nix fmt -- --ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-write-lock-file --command stylua --check colors lua
      - run: nix develop --no-write-lock-file --command luacheck colors lua
      - run: nix develop --no-write-lock-file --command shellcheck generate.sh tests/run.sh
      - run: nix develop --no-write-lock-file --command shfmt -d -i 2 -ci generate.sh tests/run.sh
