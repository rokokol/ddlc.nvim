name: palette-drift

# Regenerates the palette and syntax tables against the HEAD of ddlc-palette and ddlc-themes every
# week and opens a pull request when a colour has moved upstream. Separate from the main check on
# purpose: that one renders against the locked inputs and would keep passing forever while the
# theme drifts away from them
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: take the palette's and the syntax table's HEAD
        run: |
          nix flake update ddlc-palette ddlc-themes
          nix develop -c ./generate.sh

      - name: open a pull request if it drifted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tables="lua/ddlc/palette.lua lua/ddlc/syntax.lua"
          # shellcheck disable=SC2086 # the tables are a word list on purpose
          if git diff --quiet -- $tables; then
            echo "the theme still matches the palette and the syntax table"
            exit 0
          fi

          # Which slot or role moved where, so the notification alone says whether this needs a look
          # shellcheck disable=SC2086
          summary=$(git diff -U0 -- $tables | grep -E '^[-+] +(base|\[")' | head -20)
          branch=palette/$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "$(printf 'the palette moved\n\n%s\n' "$summary")"
          git push -f origin "$branch"
          body=$(printf 'ddlc-palette changed and the theme no longer renders the same.\n\n```diff\n%s\n```\n\nThe lock is bumped in this branch, so merging takes both the new colours and the palette it measured them from.\n' "$summary")
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --head "$branch" --title "the palette moved" --body "$body"
          else
            gh pr edit "$branch" --body "$body"
            echo "a pull request for $branch is already open — force-pushed onto it"
          fi
